[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "xyz-churn-survival"
version = "1.0.0"
description = "Production-grade survival analysis churn model for XYZ India PC market"
authors = [{ name = "XYZ Data Science Team" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "pipelines*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
# warn_return_any disabled: lifelines, MLflow, and PySpark are weakly typed.
# Wrapper methods that return their results would all be flagged as "returning Any".
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Suppress mypy on the test directory and CLI scripts — strict typing of the
# library code itself is what matters for production.
exclude = ["tests/", "pipelines/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: fast unit tests (no Spark, no MLflow)",
    "integration: slower integration tests (Spark or MLflow required)",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "notebooks/*",
    # PySpark-dependent modules — require a full Spark/Java runtime to exercise.
    # Unit tests cover the pandas/lifelines layers; integration tests under
    # tests/integration/ cover these (run separately, not in unit-test CI gate).
    "src/data/data_loader.py",
    "src/features/feature_engineering.py",
    "src/scoring/batch_scorer.py",
    "src/utils/spark_utils.py",
]

[tool.coverage.report]
# Realistic threshold for the current unit-test suite (32 tests, no Spark).
# Increase as additional tests are added for data_generator, model_selector,
# performance_monitor, and mlflow_utils.
fail_under = 30
show_missing = true
